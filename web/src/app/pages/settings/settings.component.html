<div class="settings-page-container">
  <!-- Top Full-Width Header Bar (Code Viewer Header Style) -->
  <div class="settings-header-bar">
    <div class="header-left">
      <button type="button" class="icon-btn" (click)="goBack()" title="뒤로가기">
        <i class="bx bx-chevron-left"></i>
      </button>

      <div class="page-title-group">
        <h2 class="page-title">설정</h2>
      </div>
    </div>
  </div>

  <!-- Main Body Wrapper -->
  <div class="settings-body-wrapper">
    <!-- Sunken Inset Neumorphic Panel (Code Viewer Panel Style) -->
    <div class="settings-panel">
      <div class="panel-header">
        <h2 class="panel-title">환경설정</h2>
        <p class="panel-subtitle">AI 대화 모델 및 화면 테마 설정을 관리할 수 있습니다.</p>
      </div>

      <div class="settings-form-body">
        <!-- AI 모델 및 인터페이스 옵션 -->
        <div class="section-block">
          <div class="section-title">
            AI 모델 및 언어 처리
          </div>

          <div class="setting-item-row">
            <div class="item-info">
              <span class="item-name">기본 AI 모델 선택</span>
              <span class="item-desc">새 대화 및 파일 분석 시작 시 적용되는 기본 AI 모델입니다.</span>
            </div>
            <div class="item-control">
              <c-dropdown [options]="modelOptions" menuWidth="240px" direction="down" align="right">
                <button class="model-select-btn" type="button">
                  {{ defaultModel }} <i class="bx bx-chevron-down"></i>
                </button>
              </c-dropdown>
            </div>
          </div>
        </div>

        <div class="divider"></div>

        <!-- 디자인 테마 관리 -->
        <div class="section-block">
          <div class="section-title">
            디자인 테마 관리
          </div>

          <div class="setting-item-row">
            <div class="item-info">
              <span class="item-name">기본 테마 선택</span>
              <span class="item-desc">어플리케이션 전반에 적용되는 시각적 테마 스타일을 선택합니다.</span>
            </div>
            <div class="item-control">
              <c-tab-bar variant="segment" size="small" [options]="themeTabOptions"
                [value]="defaultTheme" (valueChange)="onThemeTabChange($event)"></c-tab-bar>
            </div>
          </div>

          <div class="setting-item-row">
            <div class="item-info">
              <span class="item-name">다크 모드</span>
              <span class="item-desc">어두운 화면 테마를 적용하여 눈의 피로를 줄입니다.</span>
            </div>
            <div class="item-control">
              <c-toggle [(checked)]="isDarkMode" (checkedChange)="onDarkModeToggle($event)"></c-toggle>
            </div>
          </div>
        </div>

        <div class="divider"></div>

        <!-- 하단 액션 버튼 -->
        <div class="form-actions-bar" style="display: flex; gap: 12px; justify-content: flex-end; flex-wrap: wrap;">
          <c-button theme="primary" (onClick)="openThemeSelectModal()">
            <i class="bx bx-palette"></i> 디자인 테마 선택 모달
          </c-button>

          <c-button theme="secondary" (onClick)="openGuideModal()">
            <i class="bx bx-help-circle"></i> 사용방법 안내
          </c-button>

          <c-button theme="neutral" (onClick)="onResetDefaults()">
            <i class="bx bx-refresh"></i> 기본값 복원
          </c-button>
        </div>
      </div>
    </div>
  </div>

  <app-theme-select-modal [isOpen]="isThemeModalOpen" (onClose)="onThemeSelectModalClosed()"></app-theme-select-modal>
  <app-guide-modal [isOpen]="isGuideModalOpen" (onClose)="isGuideModalOpen = false"></app-guide-modal>
</div>
