<div class="account-page-container">
  <!-- Top Full-Width Header Bar (Code Viewer Header Style) -->
  <div class="account-header-bar">
    <div class="header-left">
      <button type="button" class="icon-btn" (click)="goBack()" title="뒤로가기">
        <i class="bx bx-chevron-left"></i>
      </button>

      <div class="page-title-group">
        <h2 class="page-title">내 정보</h2>
      </div>
    </div>
  </div>

  <!-- Main Body Wrapper -->
  <div class="account-body-wrapper">
    <!-- Sunken Inset Neumorphic Panel (Code Viewer Panel Style) -->
    <div class="account-panel">
      <div class="panel-header">
        <h2 class="panel-title">내 정보 변경</h2>
        <p class="panel-subtitle">프로필 닉네임과 계정 비밀번호를 안전하게 수정할 수 있습니다.</p>
      </div>

      <div class="account-form-body">
        <!-- 이메일 정보 (읽기 전용) -->
        <div class="section-block">
          <div class="section-title">
            <i class="bx bx-envelope"></i> 아이디 (이메일)
          </div>
          <input type="text" class="neu-input readonly" [value]="email" readonly />
        </div>

        <div class="divider"></div>

        <!-- 닉네임 수정 -->
        <div class="section-block">
          <div class="section-title">
            <i class="bx bx-id-card"></i> 닉네임
          </div>
          <div class="input-with-btn-row">
            <input type="text" class="neu-input" [(ngModel)]="editNickname" placeholder="새 닉네임을 입력하세요" />
            <c-button theme="primary" (onClick)="onUpdateNickname()">
              닉네임 변경
            </c-button>
          </div>
        </div>

        <div class="divider"></div>

        <!-- 비밀번호 변경 -->
        <div class="section-block">
          <div class="section-title">
            <i class="bx bx-lock-alt"></i> 비밀번호 변경
          </div>
          <div class="form-grid">
            <div class="form-field">
              <label class="field-label">새 비밀번호</label>
              <input type="password" class="neu-input" [(ngModel)]="newPassword" placeholder="최소 6자리 이상 입력" />
            </div>
            <div class="form-field">
              <label class="field-label">새 비밀번호 확인</label>
              <input type="password" class="neu-input" [(ngModel)]="confirmPassword" placeholder="비밀번호를 한번 더 입력" />
            </div>
          </div>
          <div class="form-action-right">
            <c-button theme="warn" (onClick)="onUpdatePassword()">
              <i class="bx bx-key"></i> 비밀번호 변경
            </c-button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
