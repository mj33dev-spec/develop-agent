<div class="login-container">
  <div class="login-box">
    <div class="logo-icon-wrapper">
      <span class="material-symbols-outlined logo-icon">lock</span>
    </div>

    <h2>TemPgentAI 로그인</h2>
    <!-- <h2>템피전트AI 로그인</h2> -->
    <p class="subtitle">서비스를 이용하려면 <br>이메일과 비밀번호로 로그인해주세요.</p>

    <form #loginForm="ngForm" (ngSubmit)="onSignIn()">
      <div class="form-group">
        <label for="email">이메일</label>
        <div class="input-wrapper">
          <span class="material-symbols-outlined input-icon">mail</span>
          <input type="email" id="email" name="email" [(ngModel)]="email" required placeholder="you@example.com">
        </div>
      </div>

      <div class="form-group">
        <label for="password">비밀번호</label>
        <div class="input-wrapper">
          <span class="material-symbols-outlined input-icon">key</span>
          <input type="password" id="password" name="password" [(ngModel)]="password" (keyup.enter)="onSignIn()"
            required minlength="6" placeholder="••••••••">
        </div>
      </div>

      <div class="button-group">
        <button type="submit" class="neu-btn primary-btn" [disabled]="isLoading">
          <span *ngIf="isLoading" class="btn-text">로딩 중...</span>
          <span *ngIf="!isLoading" class="btn-text">로그인</span>
        </button>
      </div>

      <div class="extra-links">
        <span class="link-text" (click)="openSignUpModal()">회원가입</span>
      </div>
    </form>
  </div>
</div>

<!-- 회원가입 모달 -->
<c-modal [isOpen]="isSignUpModalOpen" title="새 계정 만들기" [isForm]="true" submitLabel="가입하기" cancelLabel="취소"
  [submitDisabled]="!signUpEmail || !signUpPassword || signUpPassword.length < 6 || isLoading"
  (onClose)="closeSignUpModal()" (onSubmit)="onSignUp()">

  <div class="form-group neu-form-group">
    <label for="signUpEmail">이메일</label>
    <div class="input-wrapper">
      <span class="material-symbols-outlined input-icon">mail</span>
      <input type="email" id="signUpEmail" name="signUpEmail" [(ngModel)]="signUpEmail" required
        placeholder="you@example.com">
    </div>
  </div>

  <div class="form-group neu-form-group">
    <label for="signUpPassword">비밀번호</label>
    <div class="input-wrapper">
      <span class="material-symbols-outlined input-icon">key</span>
      <input type="password" id="signUpPassword" name="signUpPassword" [(ngModel)]="signUpPassword"
        (keyup.enter)="onSignUp()" required minlength="6" placeholder="6자리 이상">
    </div>
  </div>
</c-modal>
