<div class="app-layout">
  <!-- Left Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <button class="new-chat-btn" (click)="createNewRoom()">
        <i class="bx bx-edit-alt"></i> 새 채팅
      </button>
    </div>
    
    <div class="room-list">
      <div class="room-item" 
           *ngFor="let room of rooms" 
           [class.active]="activeRoomId === room.id"
           (click)="selectRoom(room.id)">
        <i class="bx bx-message-square-detail"></i>
        <span class="room-title">{{ room.title }}</span>
      </div>
      
      <div class="empty-rooms" *ngIf="rooms.length === 0">
        <p>생성된 방이 없습니다.</p>
      </div>
    </div>
  </aside>

  <!-- Right Main Area -->
  <main class="main-content">
    
    <!-- Home View (Copilot Style) when no room is selected -->
    <div class="home-view" *ngIf="!activeRoomId">
      <div class="home-container">
        <h1 class="greeting">안녕하세요, 33이민재 님. 오늘 무엇을 알아볼까요?</h1>
        
        <div class="copilot-input-box">
          <div class="input-body">
            <textarea 
                   [(ngModel)]="homeInput" 
                   (keydown.enter)="handleEnter($event)"
                   (input)="autoResize($event)"
                   placeholder="Copilot에 메시지" 
                   class="main-textarea"
                   rows="1"></textarea>
            
            <div class="input-footer">
              <div class="footer-left">
                <button class="add-btn"><i class="bx bx-plus"></i></button>
                <c-dropdown [options]="modelOptions" [width]="'160px'" direction="up">
                  <c-badge variant="neutral" style="cursor: pointer; user-select: none; padding: 4px 10px;">
                    {{ selectedModel }} <i class="bx bx-chevron-down" style="vertical-align: middle; margin-left: 2px;"></i>
                  </c-badge>
                </c-dropdown>
              </div>
              
              <div class="footer-right">
                <button class="send-btn" (click)="createNewRoom(homeInput)" [disabled]="!homeInput.trim()" [class.active]="homeInput.trim()">
                  <i class="bx bx-up-arrow-alt"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
        
        <div class="disclaimer">
          Copilot은 AI이므로 실수를 할 수 있습니다. Copilot을 사용하면, 귀하는 사용 약관에 동의하는 것입니다. 개인정보처리방침을 확인하세요.
        </div>
      </div>
    </div>

    <!-- Chat View (Kakao Style) when a room is selected -->
    <div class="chat-view" *ngIf="activeRoomId">
      <app-chat [room]="activeRoom"></app-chat>
    </div>
    
  </main>
</div>
