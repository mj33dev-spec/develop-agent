<div #anchorRef class="dropdownContainer" [style.width]="width">
  <!-- More Variant -->
  <ng-container *ngIf="variant === 'more'">
    <div class="dropdownWrapper">
      <c-button size="more" (onClick)="toggleDropdown()" [disabled]="disabled"></c-button>
    </div>
  </ng-container>

  <!-- Button/Multi Variant -->
  <ng-container *ngIf="variant !== 'more' && (value !== undefined || variant === 'multi')">
    <div class="dropdownWrapper" [style.width]="width ? '100%' : 'auto'">
      <c-button
        type="button"
        [theme]="variant === 'fill' ? 'neutral' : 'outlinedNeutral'"
        (onClick)="toggleDropdown()"
        [style.width]="width ? '100%' : 'auto'"
        [disabled]="disabled"
      >
        <span style="display: flex; align-items: center; gap: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;">
          <i *ngIf="icon" class="bx" [ngClass]="icon" style="font-size: 20px;"></i>
          <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ value }}</span>
        </span>
        <i class="bx bx-chevron-down" style="margin-left: 8px; font-size: 20px; flex-shrink: 0;"></i>
      </c-button>
    </div>

    <!-- Multi Chips -->
    <div *ngIf="variant === 'multi'" class="multiSelectContainer">
      <span *ngFor="let val of selectedValues" class="multiChip">
        {{ val }}
        <i class="bx bx-x" (click)="$event.stopPropagation(); removeValue.emit(val)"></i>
      </span>
    </div>
  </ng-container>

  <!-- Pure Anchor Variant -->
  <ng-container *ngIf="variant !== 'more' && value === undefined && variant !== 'multi'">
    <div (click)="toggleDropdown()" style="display: inline-block;">
      <ng-content></ng-content>
    </div>
  </ng-container>

  <!-- Dropdown Menu Portaled to Body -->
  <ng-container *ngIf="open">
    <div 
      class="dropdown-portal-menu"
      [ngClass]="[variant === 'fill' ? 'fill' : 'outlinedDropdown', customClass]" 
      [ngStyle]="dropdownCssVars"
    >
      <ng-container *ngFor="let opt of options">
        <hr *ngIf="isDivider(opt)" />
        <button
          *ngIf="!isDivider(opt)"
          type="button"
          class="dropdownItem"
          [class.selected]="isOptionSelected(opt)"
          [class.disabled]="isOptionDisabled(opt)"
          [disabled]="isOptionDisabled(opt)"
          (click)="handleItemClick($event, opt)"
        >
          <i *ngIf="getOptionIcon(opt)" class="bx dropdownItemIcon" [ngClass]="getOptionIcon(opt)"></i>
          {{ getOptionLabel(opt) }}
        </button>
      </ng-container>
    </div>
  </ng-container>
</div>
