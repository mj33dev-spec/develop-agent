<div class="code-viewer-container">
  <!-- 1. Header (대화창과 동일한 위계 및 선택자) -->
  <div class="chat-header">
    <div class="header-left">
      <button type="button" class="icon-btn" (click)="goBack()" title="닫기">
        <i class="bx bx-chevron-left"></i>
      </button>

      <div class="file-info">
        <i [class]="fileIconClass" class="file-icon"></i>
        <h2 class="file-name">{{ file.name }}</h2>
        <span class="file-size">{{ formattedSize }}</span>
      </div>
    </div>
  </div>

  <!-- 2. Body with Central Main Card (대화창과 동일한 위계 및 선택자) -->
  <div class="chat-body">
    <div class="chat-main-card">
      <div class="code-panel" [ngClass]="'theme-' + themeClass">
        <!-- Absolute Top Right Floating Icon Action Buttons -->
        <div class="floating-actions">
          <button type="button" class="floating-btn" (click)="copyAllCode()" title="전체 복사">
            <i class="bx bx-copy"></i>
          </button>

          <button type="button" class="floating-btn primary" (click)="downloadFile()" title="다운로드">
            <i class="bx bx-download"></i>
          </button>
        </div>

        <table class="code-table">
          <tbody>
            <tr *ngFor="let line of highlightedLines; trackBy: trackByLineNum">
              <td class="line-number">{{ line.lineNum }}</td>
              <td class="line-code"><code [innerHTML]="line.html"></code></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 3. Footer Input Area (대화창과 동일한 위계 및 선택자) -->
  <div class="chat-footer-input">
    <div class="chat-input-box">
      <div class="input-body">
        <!-- 첨부된 파일/채팅방 칩 뱃지 목록 -->
        <div class="attached-items-container" *ngIf="attachedItems.length > 0">
          <div class="attached-chip" *ngFor="let item of attachedItems; let i = index">
            <img *ngIf="item.imageUrl" [src]="item.imageUrl" class="chip-thumb" />
            <i *ngIf="!item.imageUrl" [class]="item.icon || 'bx bx-file'"></i>
            <span class="chip-name">{{ item.name }}</span>
            <button type="button" class="remove-chip-btn" (click)="removeAttachedItem(i)">
              <i class="bx bx-x"></i>
            </button>
          </div>
        </div>

        <textarea 
               [(ngModel)]="userInput" 
               (keydown.enter)="handleEnter($event)"
               (input)="autoResize($event)"
               [placeholder]="'\'' + file.name + '\' 파일에 대해 AI 질문하기...'" 
               class="chat-textarea"
               rows="1">
        </textarea>
        
        <div class="input-footer">
          <div class="footer-left">
            <c-dropdown [options]="addMenuOptions" menuWidth="240px" direction="up">
              <button class="add-btn" type="button" title="추가 옵션">
                <i class="bx bx-plus"></i>
              </button>
            </c-dropdown>
          </div>
          
          <div class="footer-right">
            <c-dropdown [options]="modelOptions" [value]="selectedModel" menuWidth="240px" direction="up" align="right">
              <button class="model-btn" type="button" title="모델 선택">
                {{ selectedModel }} <i class="bx bx-chevron-down" style="vertical-align: middle; margin-left: 2px;"></i>
              </button>
            </c-dropdown>
            
            <button (click)="sendQuestion()" class="send-btn" [disabled]="!userInput.trim() && attachedItems.length === 0" [class.active]="userInput.trim() || attachedItems.length > 0">
              <i class="bx bx-up-arrow-alt"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
