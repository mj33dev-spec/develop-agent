<div *ngIf="isOpen" class="modalOverlay" (click)="handleOverlayClick($event)">
  <div class="modalContent" [class.has-sidebar]="hasSidebar" [style.width]="width" [style.height]="height" (click)="$event.stopPropagation()">
    
    <!-- 절대 위치 닫기 버튼 (헤더가 숨김 처리된 모달용) -->
    <button *ngIf="hideHeader" type="button" class="closeBtn absoluteCloseBtn" (click)="onClose.emit()" aria-label="Close">
      <i class="bx bx-x"></i>
    </button>

    <div [class.modalSidebarLayout]="hasSidebar" style="display: flex; flex: 1; min-height: 0; width: 100%;">
      <!-- 사이드바 영역 (hasSidebar = true 일 때만 렌더링) -->
      <aside *ngIf="hasSidebar" class="modalSidebarContainer">
        <ng-content select="c-modal-sidebar"></ng-content>
      </aside>

      <!-- 메인 메인 영역 (오직 단 1개의 ng-content가 존재하는 유일한 메인 컨테이너) -->
      <div class="modalMainContainer" style="display: flex; flex-direction: column; flex: 1; min-height: 0; width: 100%;">
        <div class="modalHeader" *ngIf="!hideHeader">
          <h2 class="modalTitle">
            <span [innerHTML]="title"></span>
          </h2>
          <button type="button" class="closeBtn" (click)="onClose.emit()" aria-label="Close">
            <i class="bx bx-x"></i>
          </button>
        </div>
        <p *ngIf="subTitle && !hideHeader" class="modalSubTitle">{{ subTitle }}</p>

        <!-- 전체 c-modal 템플릿 중 오직 단 1개만 존재하는 메인 ng-content -->
        <div class="modalBody">
          <ng-content></ng-content>
        </div>

        <div class="formActions" *ngIf="!hideFooter">
          <ng-content select="[footer]"></ng-content>
          
          <ng-container *ngIf="!customFooter">
            <c-button *ngIf="!hideCancel" theme="neutral" (onClick)="onClose.emit()">
              {{ cancelLabel }}
            </c-button>
            
            <c-button 
              [type]="isForm ? 'submit' : 'button'" 
              [theme]="submitTheme" 
              [disabled]="submitDisabled"
              (onClick)="handleSubmit()"
            >
              {{ submitLabel }}
            </c-button>
          </ng-container>
        </div>
      </div>
    </div>

  </div>
</div>
